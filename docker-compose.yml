# ============================================================
# DocuVision Pro - Docker Compose
# Optimized for development and production
# ============================================================

version: "3.8"

services:
  docuvision:
    build:
      context: .
      dockerfile: codes/Dockerfile
      # Enable BuildKit for faster builds
      args:
        BUILDKIT_INLINE_CACHE: 1
    image: docuvision-pro:latest
    container_name: docuvision-pro

    # Restart policy
    restart: unless-stopped

    # Port mapping
    ports:
      - "${GRADIO_PORT:-7860}:7860"

    # Environment variables
    environment:
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7861
      # Torch settings for CPU optimization
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-4}
      - MKL_NUM_THREADS=${MKL_NUM_THREADS:-4}
      # Python optimization
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1

    # Volume mounts for persistence and optimization
    volumes:
      # Models - persist trained models (read-only in production)
      - type: bind
        source: ${MODEL_PATH:-./models}
        target: /app/models
        read_only: true

      # Output directory - for processed images
      - type: volume
        source: docuvision-output
        target: /app/output

      # Temp directory - for temporary processing files
      - type: tmpfs
        target: /tmp/docuvision
        tmpfs:
          size: 1G
          mode: 1777

      # Cache directory - for pip/torch cache (speeds up restarts)
      - type: volume
        source: docuvision-cache
        target: /home/docuvision/.cache

      # Upload directory - for user uploads (optional bind mount)
      - type: bind
        source: ${UPLOAD_PATH:-./uploads}
        target: /app/uploads

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: "${CPU_LIMIT:-4}"
          memory: ${MEMORY_LIMIT:-8G}
        reservations:
          cpus: "${CPU_RESERVATION:-2}"
          memory: ${MEMORY_RESERVATION:-4G}

    # Health check
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:7861')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Security options
    security_opt:
      - no-new-privileges:true

    # Read-only root filesystem (optional, uncomment for production)
    # read_only: true

  # ============================================================
  # Optional: Nginx reverse proxy for production
  # ============================================================
  # nginx:
  #   image: nginx:alpine
  #   container_name: docuvision-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - docuvision
  #   networks:
  #     - docuvision-network

# ============================================================
# Named Volumes
# ============================================================
volumes:
  # Persistent output storage
  docuvision-output:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${OUTPUT_VOLUME_PATH:-./output}

  # Cache volume for faster restarts
  docuvision-cache:
    driver: local
